apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: kafka-demo

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-demo

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70