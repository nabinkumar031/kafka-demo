apiVersion: v1
kind: Service

metadata:
  name: kafka-demo-service

  labels:
    app: kafka-demo

spec:
  type: NodePort

  selector:
    app: kafka-demo

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}